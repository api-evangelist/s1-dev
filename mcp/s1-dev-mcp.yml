  via clerk.s1.dev) or a Search1API API key. The same server ships as the npm package search1api-mcp for local stdio
  use. Tool names and input schemas below are the ones the provider PUBLISHES in its MCP server card and docs table;
  an anonymous tools/list was refused with 401 (0.6.1 restored authentication on every /mcp request), so no live
  tool listing was observed.

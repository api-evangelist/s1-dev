secondary_servers:
- name: Search1API Blog MCP
  url: https://blog.s1.dev/mcp
  transport: streamable-http
  verified: probed
  note: Anonymous tools/list answered 200 with four read-only blog content tools; its protected-resource document
    names https://blog.s1.dev/_emdash as authorization server for write scopes. A content server for the blog, not
    the search API.
  tools:
  - name: search_posts
    description: Search Search1API Blog posts by keyword. Returns matching posts with excerpts and URLs.
    inputs:
    - query
    - limit
  - name: list_posts
    description: List Search1API Blog posts in reverse chronological order. Optionally filter by tag slug and paginate
      with nextCursor.
    inputs:
    - limit
    - cursor
    - tag
  - name: get_post
    description: Get a single Search1API Blog post by slug, including plain-text body content.
    inputs:
    - slug
  - name: list_tags
    description: List all tags used on the Search1API Blog.
    inputs: []

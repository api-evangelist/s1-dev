tools:
- name: search
  description: Search the live public web when the user needs current information, sources, or research. Returns
    citable results with id, title, URL, and text. Each result includes a URL that can be read in full.
  inputs:
  - query
  - max_results
  - search_service
  - crawl_results
  - include_sites
  - exclude_sites
  - time_range
  required:
  - query
  source: https://s1.dev/.well-known/s1-dev-mcp-server-card.json
- name: news
  description: Search current news when the user asks about recent events, announcements, or coverage. Returns citable
    article results with title, URL, snippet, and optional extracted text.
  inputs:
  - query
  - max_results
  - search_service
  - crawl_results
  - include_sites
  - exclude_sites
  - time_range
  required:
  - query
  source: https://s1.dev/.well-known/s1-dev-mcp-server-card.json
- name: crawl
  description: Extract the readable title and full text from a public URL supplied by the user or returned by search.
  inputs:
  - url
  required:
  - url
  source: https://s1.dev/.well-known/s1-dev-mcp-server-card.json
- name: sitemap
  description: Discover related public links from a page or domain when the user wants to explore a site's structure
    or available pages.
  inputs:
  - url
  required:
  - url
  source: https://s1.dev/.well-known/s1-dev-mcp-server-card.json
- name: trending
  description: List currently trending repositories or stories from GitHub or Hacker News when the user asks what
    is popular now.
  inputs:
  - search_service
  - max_results
  required:
  - search_service
  source: https://s1.dev/.well-known/s1-dev-mcp-server-card.json

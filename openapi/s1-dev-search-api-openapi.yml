openapi: 3.2.0
info:
  title: S1 Dev Search API
  version: 1.0.0
  x-guidance: Search1API provides web search, news aggregation, URL crawling, webpage screenshots, sitemap extraction, trending topics, content extraction, and deep crawling. All paid endpoints accept POST with a JSON body. Use POST /search with a "query" field for web search. Use POST /news with a "query" field for news. Use POST /ask with a natural-language "query" to have Search1API choose the engines and time window and return only relevant results (API key only). Use POST /crawl with a "url" field to crawl a page. Use POST /screenshot with a "url" field to render a PNG, JPEG, or WebP image. Use POST /sitemap with a "url" field to extract sitemap URLs. Use POST /trending with a "search_service" field for trends. Use POST /extract with a "url" field for structured content extraction. Use POST /deepcrawl with a "url" field for deep multi-page crawling.
  description: 'Operations tagged Search across 2 of this provider''s published API definitions: search1api-openapi.json, s1-dev-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.search1api.com
tags:
- name: Search
paths:
  /search:
    post:
      operationId: search
      summary: Search the web using multiple search engines
      description: Search the live public web when the answer depends on current information, sources, or research a model's training data cannot cover. Returns ranked results with id, title, URL, snippet, and `published_date` (ISO 8601, when the engine exposes one) across 13+ engines, with optional images. Set `crawl_results` to pull the top N result pages in the same call — each crawled page is billed as an additional crawl — or pass a result URL to POST /crawl separately. Costs 1 credit per request.
      tags:
      - Search
      x-codeSamples:
      - id: js
        lang: ts
        label: TypeScript SDK
        source: "import { Search1API } from '@search1api/client';\n\nconst client = new Search1API();\nconst response = await client.search('latest AI agent frameworks', {\n  maxResults: 10,\n});\n\nconsole.log(response.results);"
      - id: python
        lang: python
        label: Python SDK
        source: "from search1api import Search1API\n\nclient = Search1API()\nresponse = client.search(\n    \"latest AI agent frameworks\",\n    max_results=10,\n)\n\nprint(response[\"results\"])"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SearchResponse'
                - $ref: '#/components/schemas/SearchBatchResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '402':
          description: Payment Required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-payment-info:
        protocols:
        - mpp
        pricingMode: fixed
        price: '0.003'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                properties:
                  query:
                    type: string
                    minLength: 1
                  search_service:
                    type: string
                    enum:
                    - google
                    - bing
                    - bingcn
                    - duckduckgo
                    - yahoo
                    - yandex
                    - youtube
                    - x
                    - reddit
                    - github
                    - arxiv
                    - wechat
                    - bilibili
                    - imdb
                    - wikipedia
                    - ''
                    - baidu
                    - '360'
                    - quark
                  max_results:
                    type: integer
                    minimum: 1
                    maximum: 50
                    default: 5
                  page:
                    type: integer
                    minimum: 1
                    maximum: 100
                    default: 1
                  crawl_results:
                    type: integer
                    minimum: 0
                    maximum: 50
                    default: 0
                  image:
                    type: boolean
                    default: false
                  include_sites:
                    type: array
                    items:
                      type: string
                    default: []
                  exclude_sites:
                    type: array
                    items:
                      type: string
                    default: []
                  language:
                    type: string
                  time_range:
                    type: string
                    enum:
                    - day
                    - week
                    - month
                    - year
                    - ''
                required:
                - query
                additionalProperties: false
              - type: array
                items:
                  type: object
                  properties:
                    query:
                      type: string
                      minLength: 1
                    search_service:
                      type: string
                      enum:
                      - google
                      - bing
                      - bingcn
                      - duckduckgo
                      - yahoo
                      - yandex
                      - youtube
                      - x
                      - reddit
                      - github
                      - arxiv
                      - wechat
                      - bilibili
                      - imdb
                      - wikipedia
                      - ''
                      - baidu
                      - '360'
                      - quark
                    max_results:
                      type: integer
                      minimum: 1
                      maximum: 50
                      default: 5
                    page:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 1
                    crawl_results:
                      type: integer
                      minimum: 0
                      maximum: 50
                      default: 0
                    image:
                      type: boolean
                      default: false
                    include_sites:
                      type: array
                      items:
                        type: string
                      default: []
                    exclude_sites:
                      type: array
                      items:
                        type: string
                      default: []
                    language:
                      type: string
                    time_range:
                      type: string
                      enum:
                      - day
                      - week
                      - month
                      - year
                      - ''
                  required:
                  - query
                  additionalProperties: false
                minItems: 1
    servers:
    - url: https://api.search1api.com
  /news:
    post:
      operationId: news
      summary: Search news articles across multiple sources
      description: Search recent news when the question is about events, announcements, or coverage rather than reference material. Returns articles from verified publishers with title, URL, snippet, `published_date` (ISO 8601, when known), and optional full page content, filterable by site, language, and time range. For questions that are not time-sensitive, prefer POST /search. Costs 1 credit per request.
      tags:
      - Search
      x-codeSamples:
      - id: js
        lang: ts
        label: TypeScript SDK
        source: "import { Search1API } from '@search1api/client';\n\nconst client = new Search1API();\nconst response = await client.news('latest AI industry news', {\n  maxResults: 10,\n});\n\nconsole.log(response.results);"
      - id: python
        lang: python
        label: Python SDK
        source: "from search1api import Search1API\n\nclient = Search1API()\nresponse = client.news(\n    \"latest AI industry news\",\n    max_results=10,\n)\n\nprint(response[\"results\"])"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/NewsResponse'
                - $ref: '#/components/schemas/NewsBatchResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '402':
          description: Payment Required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-payment-info:
        protocols:
        - mpp
        pricingMode: fixed
        price: '0.003'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                properties:
                  query:
                    type: string
                    minLength: 1
                  search_service:
                    type: string
                    enum:
                    - google
                    - bing
                    - duckduckgo
                    - yahoo
                    - hackernews
                    - ''
                    - reuters
                  max_results:
                    type: integer
                    minimum: 1

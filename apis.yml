aid: s1-dev
name: Search1API
description: Search1API is web access infrastructure for AI agents, operated by SuperAgents, LLC (Delaware). One
  credit-metered REST API at api.search1api.com provides multi-engine web search (Google, Bing, DuckDuckGo, Yandex,
  GitHub, arXiv, Reddit, X, Baidu and more), agentic search routed by the TypeSafe Jev model, news search, page
  crawling, screenshots, sitemap discovery, trending topics, structured extraction and asynchronous deep crawls.
  The same account reaches it through an OpenAPI 3.1 contract, official TypeScript and Python SDKs, the s1 CLI,
  a hosted OAuth 2.1 MCP server at mcp.search1api.com, an Agent Skill, and pay-per-request MPP/x402 payment challenges.

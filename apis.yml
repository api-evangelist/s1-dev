apis:
- aid: s1-dev:search1api-mcp-server
  name: Search1API MCP Server
  description: >-
    Official hosted Streamable HTTP MCP server exposing search, news, crawl, sitemap and trending tools
    to any MCP client, with OAuth 2.1 (PKCE, dynamic client registration via clerk.s1.dev) or a Search1API
    API key. Also published as the npm package search1api-mcp for local stdio use, and listed in the Claude
    directory as a connector and a plugin.
  humanURL: https://s1.dev/mcp-server
  baseURL: https://mcp.search1api.com/mcp
  tags:
  - MCP
  - AI Agents
  - Search
  properties:
  - type: Documentation
    url: https://s1.dev/docs/integrations/mcp
  - type: MCPServerCard
    name: MCP server card
    url: https://s1.dev/.well-known/mcp/server-card.json
  - type: SourceCode
    url: https://github.com/superagents-lab/search1api-mcp
- aid: s1-dev:search1api-blog-mcp-server
  name: Search1API Blog MCP Server
  description: >-
    Secondary MCP server on the Search1API blog host exposing four read-only content tools (search_posts,
    list_posts, get_post, list_tags); an anonymous tools/list answered with the tool schemas. Serves blog
    content, not the search API.
  humanURL: https://blog.s1.dev/
  baseURL: https://blog.s1.dev/mcp
  tags:
  - MCP
  - Blog
  properties:
